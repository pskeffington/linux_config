name: Validate RF master package library

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate library, manifest equivalence and scripts
        run: |
          python3 scripts/package-library.py validate --check
          python3 -m unittest discover -s tests -v
          bash tests/static.sh
          bash -n deploy.sh scripts/*.sh
